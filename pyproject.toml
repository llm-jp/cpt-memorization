[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpt-memorization"
version = "0.1.0"
description = "Evaluate document-grounded QA and training-text memorization after continued pretraining."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "PyYAML>=6,<7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4"]
corpus = ["datatrove[io,processing]==0.8.0", "xxhash>=3.6,<4", "fasttext-numpy2-wheel>=0.9.2,<0.10", "spacy>=3.8,<4", "sudachipy>=0.6.10,<0.7", "sudachidict-core>=20250825"]
tokenizers = ["transformers==4.57.6"]
analysis = ["orjson>=3.11,<4", "pandas>=2.3,<3", "zstandard>=0.25,<1", "tiktoken>=0.12,<1"]
clustering = ["sentence-transformers>=5,<6", "scikit-learn>=1.7,<2", "umap-learn>=0.5,<0.6", "hdbscan>=0.8,<0.9", "scipy>=1.16,<2"]
inference = ["vllm==0.14.1", "transformers==4.57.6", "openai-harmony>=0.0.4,<1"]

[dependency-groups]
dev = ["ruff>=0.14,<0.15", "build>=1.3,<2"]

[project.scripts]
cpt-memorization = "cpt_memorization.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpt_memorization"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/README.md", "/THIRD_PARTY_NOTICES.md", "/LICENSE_STATUS.md", "/uv.lock", "/pyproject.toml", "/.gitignore", "/.python-version"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F541"]
